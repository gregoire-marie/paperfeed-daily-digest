<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperFeed digest for 2026-03-30</title>
  <meta name="description" content="Daily digest for 2026-03-30">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#315c72">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --sunken: #efefea;
      --ink: #171b1f;
      --muted: #4d555c;
      --line: #d5d7d3;
      --line-strong: #aeb4b3;
      --accent: #315c72;
      --accent-soft: #e5ecef;
      --font-sans: "IBM Plex Sans", system-ui, sans-serif;
      --font-display: "Space Grotesk", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #111416;
        --panel: #181c1e;
        --sunken: #0d1012;
        --ink: #e7e9e7;
        --muted: #abb2b5;
        --line: #2b3033;
        --line-strong: #495157;
        --accent: #8ab0c0;
        --accent-soft: #1e2b31;
      }
    }
    * { box-sizing: border-box; }
    html {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.65 var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    body { margin: 0; min-height: 100vh; }
    ::selection { background: var(--accent-soft); color: var(--ink); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 4px; }
    a:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }
    .hero, .stack {
      width: min(960px, calc(100% - 48px));
      margin-inline: auto;
    }
    .hero { padding: 80px 0 36px; }
    .eyebrow {
      color: var(--accent);
      font: 500 .78rem/1.4 var(--font-mono);
      letter-spacing: .13em;
      text-transform: uppercase;
      margin: 0 0 20px;
    }
    h1 {
      font: 700 clamp(2.2rem, 6vw, 4.2rem)/1.05 var(--font-display);
      letter-spacing: -.045em;
      margin: 0;
      max-width: 18ch;
    }
    .lede {
      max-width: 660px;
      color: var(--muted);
      font-size: 1.05rem;
      margin: 22px 0;
    }
    .stack { display: grid; gap: 28px; padding-bottom: 64px; }
    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 32px;
    }
    h2 {
      font: 600 1.5rem/1.3 var(--font-display);
      letter-spacing: -.025em;
      margin: 0 0 16px;
      overflow-wrap: anywhere;
    }
    .digest-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .digest-card {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
    }
    .digest-card:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      text-decoration: none;
    }
    .digest-card strong { font: 600 1rem/1.4 var(--font-display); }
    .digest-card span {
      color: var(--muted);
      font: 400 1rem/1.4 var(--font-mono);
      white-space: nowrap;
    }
    .meta { color: var(--muted); font-size: 1rem; margin: 10px 0; }
    .abstract {
      margin: 24px 0;
      padding-block: 16px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .abstract summary { cursor: pointer; font-weight: 600; color: var(--accent); }
    .abstract p {
      color: var(--muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-bottom: 0;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: minmax(0, 170px) minmax(0, 1fr);
      gap: 20px 28px;
      margin: 0;
    }
    .summary-grid dt {
      min-width: 0;
      color: var(--accent);
      font: 500 1rem/1.65 var(--font-mono);
      letter-spacing: .04em;
      text-transform: uppercase;
      padding-top: 3px;
    }
    .summary-grid dd { min-width: 0; margin: 0; color: var(--muted); }
    .summary-grid dd, .meta, .empty-state p { overflow-wrap: anywhere; }
    .link-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0; }
    .link-row a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 1rem;
    }
    .link-row a:hover { background: var(--accent-soft); border-color: var(--accent); }
    .back-link { display: inline-flex; align-items: center; min-height: 44px; font-weight: 500; }
    .empty-state { padding: 32px; }
    .empty-state p { color: var(--muted); }
    code { font: 1em var(--font-mono); background: var(--sunken); padding: .1rem .35rem; }
    @media (max-width: 640px) {
      .hero, .stack { width: calc(100% - 32px); }
      .hero { padding: 48px 0 24px; }
      .stack { gap: 20px; padding-bottom: 40px; }
      .panel { padding: 22px 18px; }
      .summary-grid { grid-template-columns: 1fr; gap: 8px; }
      .summary-grid dd { margin-bottom: 16px; }
      .summary-grid dd:last-child { margin-bottom: 0; }
      .digest-list { grid-template-columns: 1fr; }
      .digest-card { padding: 18px 14px; }
    }
  </style>
</head>
<body>
  
        <header class="hero">
          <p class="eyebrow">PaperFeed digest</p>
          <h1>March 30, 2026</h1>
          <p class="lede">0 papers selected for the day.</p>
          <p><a class="back-link" href="../index.html">Back to index</a></p>
        </header>
        <main class="stack">
          
        <section class="panel empty-state">
          <h2>No new papers today</h2>
          <p>All retrieved candidates were already seen or filtered out. The site will update again on the next run.</p>
        </section>
        
        </main>
        
</body>
</html>
