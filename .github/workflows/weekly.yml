name: Weekly Digest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/weekly.yml"
  schedule:
    - cron: "17 6 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paperfeed-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run weekly pipeline
        if: github.event_name != 'push'
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          if [ -z "$S2_API_KEY" ]; then
            echo "::error::Add the S2_API_KEY repository secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          python -m paperfeed.run_weekly

      - name: Commit generated content
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain -- site data/seen.json)" ]; then
            echo "No content changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site data/seen.json
          git commit -m "Update weekly digest"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
